name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ✅ Validate build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Calculate Next Version
        uses: nerdtronik/auto-versioning@v2
        id: versioning
        with:
          create-tag: false
      - name: Prepare Version
        env:
          RELEASE_TAG: ${{ steps.versioning.outputs.version }}
        run: scripts/release/prepare-version.sh
      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build extension
        run: npm run build
      - name: Run checks
        run: npm run check
      - name: Package signed CRX
        run: scripts/release/bundle-chrome-store.sh
        env:
          PRIVATE_KEY: ${{ secrets.CHROME_CRX_PRIVATE_KEY }}
      - name: Package extension
        run: npm run bundle
      - name: Bundle source
        run: scripts/release/make-source-zip.sh
        env:
          RELEASE_TAG: ${{ steps.versioning.outputs.version }}
          TARGET_REF: ${{ github.sha }}
      - name: Upload extension artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-${{ github.sha }}
          path: release/*.zip
          if-no-files-found: error
      - name: Upload signed CRX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-crx-${{ github.sha }}
          path: '*.crx'
          if-no-files-found: error
