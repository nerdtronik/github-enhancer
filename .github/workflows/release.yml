# Publishes a version to GitHub Releases, the Chrome Web Store, Firefox Add-ons and GitHub Packages.
# Start it by pushing a tag like v1.2.3, or run it by hand for an existing tag (docs/releasing.md).
name: Publish release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v1.2.3"
        required: true

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  EXT_SLUG: github-enhancer

permissions:
  contents: write

jobs:
  package-extension:
    name: Package the extension
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version || inputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Calculate Next Version
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: nerdtronik/auto-versioning@v2
        id: versioning
        with:
          create-tag: false
      - name: Prepare Version
        env:
          RELEASE_TAG: ${{ steps.versioning.outputs.version || inputs.tag }}
        run: scripts/release/prepare-version.sh
      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build extension
        run: npm run build
      - name: Run checks
        run: npm run check
      - name: Package signed CRX
        run: scripts/release/bundle-chrome-store.sh
        env:
          PRIVATE_KEY: ${{ secrets.CHROME_CRX_PRIVATE_KEY }}
      - name: Package extension
        run: npm run bundle
      - name: Bundle source
        run: scripts/release/make-source-zip.sh
        env:
          RELEASE_TAG: ${{ steps.versioning.outputs.version || inputs.tag }}
          TARGET_REF: ${{ github.sha }}
      - name: Upload extension artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zips
          path: release/*.zip
          if-no-files-found: error
      - name: Upload signed CRX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crx
          path: '*.crx'
          if-no-files-found: error

